<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gráfico de Unidades a Producir, Western and Steel y Costo fabricarlo CMT</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 40px;
    background-color: #f9fafb;
    color: #333;
  }
  h1 {
    text-align: center;
    color: #222;
  }
  #chart {
    max-width: 900px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<h1>Comparación: Unidades a Producir, Western and Steel y Costo fabricarlo CMT por Mes</h1>
<canvas id="chart" width="900" height="450"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
<script>
  // Datos
  const meses = ['Jun-25', 'Jul-25', 'Aug-25', 'Sep-25', 'Oct-25', 'Nov-25', 'Dec-25', 'Jan-26', 'Feb-26'];
  const unidades = [7876, 11986, 6737, 6890, 5787, 5652, 6869, 3896, 5220];
  const westernAndSteel = [11993.57, 18252.28, 10259.10, 10492.09, 8812.44, 8606.87, 10460.11, 5932.83, 7949.02];
  const costoFabricarloCMT = [4176.64, 6356.18, 3572.63, 3653.77, 3068.85, 2997.26, 3642.63, 2066.05, 2768.17];

  const ctx = document.getElementById('chart').getContext('2d');

  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: meses,
      datasets: [
        {
          type: 'bar',
          label: 'Unidades a Producir',
          data: unidades,
          backgroundColor: 'rgba(54, 162, 235, 0.7)',
          yAxisID: 'y-unidades'
        },
        {
          type: 'line',
          label: 'Western and Steel',
          data: westernAndSteel,
          borderColor: 'rgba(255, 99, 132, 0.9)',
          borderWidth: 3,
          fill: false,
          yAxisID: 'y-precio-costo'
        },
        {
          type: 'line',
          label: 'Costo fabricarlo CMT',
          data: costoFabricarloCMT,
          borderColor: 'rgba(75, 192, 192, 0.9)',
          borderWidth: 3,
          fill: false,
          yAxisID: 'y-precio-costo'
        }
      ]
    },
    options: {
      responsive: true,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      stacked: false,
      scales: {
        'y-unidades': {
          type: 'linear',
          position: 'left',
          title: {
            display: true,
            text: 'Unidades a Producir'
          },
          grid: {
            drawOnChartArea: false
          }
        },
        'y-precio-costo': {
          type: 'linear',
          position: 'right',
          title: {
            display: true,
            text: 'Western and Steel / Costo fabricarlo CMT ($)'
          },
          grid: {
            drawOnChartArea: true
          },
          beginAtZero: false
        }
      },
      plugins: {
        legend: {
          labels: {
            font: {
              size: 14,
              weight: 'bold'
            }
          }
        },
        tooltip: {
          enabled: true,
          mode: 'nearest',
          intersect: false,
          callbacks: {
            label: function(context) {
              if(context.dataset.type === 'line'){
                return context.dataset.label + ': $' + context.formattedValue;
              }
              return context.dataset.label + ': ' + context.formattedValue;
            }
          }
        }
      }
    }
  });
</script>
</body>
</html>
